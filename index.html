<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LearnUp Iterations Carousel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    height: auto;
    overflow-x: hidden;
  }
  
  body {
    font-family: -apple-system, 'Inter', 'Poppins', sans-serif;
    background: #F5F5F8;
    padding: 20px;
    margin: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  
  .carousel {
    width: 100%;
    max-width: 1200px;
    position: relative;
    margin: 0 auto;
  }
  
  .carousel-viewport {
    overflow: hidden;
    border-radius: 16px;
    background: white;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  
  .carousel-track {
    display: flex;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  .slide {
    min-width: 100%;
    position: relative;
  }
  
  .slide img {
    width: 100%;
    height: auto;
    display: block;
  }
  
  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: white;
    border: 1px solid #E6E6EE;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #2147EC;
    transition: all 0.2s ease;
    z-index: 10;
  }
  
  .nav-btn:hover {
    background: #2147EC;
    color: white;
    transform: translateY(-50%) scale(1.05);
  }
  
  .nav-btn.prev { left: -24px; }
  .nav-btn.next { right: -24px; }
  
  .dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
    margin-bottom: 8px;
  }
  
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #E6E6EE;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  
  .dot.active {
    background: #2147EC;
    width: 24px;
    border-radius: 4px;
  }
  
  .counter {
    text-align: center;
    margin-top: 4px;
    color: #5D5E60;
    font-size: 14px;
    font-weight: 500;
  }
  
  @media (max-width: 768px) {
    .nav-btn.prev { left: 8px; }
    .nav-btn.next { right: 8px; }
  }
</style>
</head>
<body>

<div class="carousel">
  <div class="carousel-viewport">
    <div class="carousel-track" id="track">
      <div class="slide"><img src="iteration1.png" alt="AI Chatbot Iteration"></div>
      <div class="slide"><img src="iteration2.png" alt="Navigation Enhancements"></div>
      <div class="slide"><img src="iteration3.png" alt="Button Hierarchy"></div>
    </div>
  </div>
  
  <button class="nav-btn prev" onclick="changeSlide(-1)">‹</button>
  <button class="nav-btn next" onclick="changeSlide(1)">›</button>
  
  <div class="dots" id="dots">
    <button class="dot active" onclick="goToSlide(0)"></button>
    <button class="dot" onclick="goToSlide(1)"></button>
    <button class="dot" onclick="goToSlide(2)"></button>
  </div>
  
  <div class="counter" id="counter">1 / 3</div>
</div>

<script>
  let currentSlide = 0;
  const totalSlides = 3;
  const track = document.getElementById('track');
  const dots = document.querySelectorAll('.dot');
  const counter = document.getElementById('counter');
  
  function updateCarousel() {
    track.style.transform = `translateX(-${currentSlide * 100}%)`;
    dots.forEach((dot, i) => {
      dot.classList.toggle('active', i === currentSlide);
    });
    counter.textContent = `${currentSlide + 1} / ${totalSlides}`;
  }
  
  function changeSlide(direction) {
    currentSlide = (currentSlide + direction + totalSlides) % totalSlides;
    updateCarousel();
  }
  
  function goToSlide(index) {
    currentSlide = index;
    updateCarousel();
  }
  
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') changeSlide(-1);
    if (e.key === 'ArrowRight') changeSlide(1);
  });
</script>

</body>
</html>
